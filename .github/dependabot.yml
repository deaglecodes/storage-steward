version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current. The cooldown skips releases younger than
  # a week, so a compromised or broken release has time to be caught before it lands here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
